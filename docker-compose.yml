services:
  postgres:
    image: postgres:16
    container_name: lightwall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightwall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightwall"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightwall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lightwall
      SESSION_SECRET: change-this-in-production
      AI_INTEGRATIONS_GEMINI_API_KEY: ${AI_INTEGRATIONS_GEMINI_API_KEY:-}
      AI_INTEGRATIONS_GEMINI_BASE_URL: ${AI_INTEGRATIONS_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-change-this-password}
      CV_SERVICE_URL: http://cv-service:8100
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - app_uploads:/app/server/uploads
    command: >
      sh -c "npm run db:push && npm start"

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: lightwall-cv-service
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${AI_INTEGRATIONS_GEMINI_API_KEY:-}
      CV_SERVICE_PORT: 8100
    expose:
      - "8100"

volumes:
  postgres_data:
  app_uploads:
